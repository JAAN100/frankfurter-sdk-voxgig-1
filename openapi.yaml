openapi: 3.1.1
info:
  title: Pro - API V1
  description: "The Nager.Date Pro API is a public service that provides reliable
    information about public holidays and long weekends for countries around the
    world. It allows developers to query national holiday dates, check whether a
    specific day is a public holiday, list upcoming holidays, and explore
    long-weekend data.\r

    \r

    \r

    \r

    By using the API, you agree to the <a
    href=\"https://date.nager.at/Legal/TermsOfService\">Terms of Service.</a>\r

    \r

    **Important note**\r

    \r

    > [!caution]\r

    > The API endpoints of version 1 are still in the beta phase and are subject
    to change. It is not yet advisable to use them for productive operation."
  termsOfService: https://date.nager.at/Legal/TermsOfService
  contact:
    name: Nager Software Solutions
    email: hello@nager.software
  version: v1
paths:
  /api/pro/v1/Countries/{countryCode}:
    get:
      tags:
        - Countries
      summary: Retrieves detailed information about a specific country
      description: >-
        Provide a valid `ISO 3166-1 alpha-2` country code to retrieve country
        metadata.

        The response includes commonly used and official country names, the
        assigned region, and if available neighboring countries based on
        geographical borders.
      parameters:
        - name: countryCode
          in: path
          description: The 2-letter ISO 3166-1 country code (e.g., "US", "GB").
          required: true
          schema:
            type: string
            default: us
      responses:
        "200":
          description: Returns the requested country information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryInfoWithBordersDto"
        "404":
          description: The provided country code is invalid or not recognized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/pro/v1/Countries/Available:
    get:
      tags:
        - Countries
      summary: Retrieve the complete list of all supported countries
      description: >-
        This endpoint returns all countries for which public-holiday data is
        available.

        Each entry includes the country's name and ISO code.
      responses:
        "200":
          description: The list of supported countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryV1Dto"
  /api/pro/v1/Holidays/{countryCode}/{year}:
    get:
      tags:
        - Holidays
      summary: Retrieve the list of all holidays for the specified year and country
      description: >-
        This endpoint returns all officially recognized holidays for the given
        country

        and year. Each holiday entry includes the local and English holiday
        names, information

        about whether the holiday applies nationally or only in specific
        subdivisions, and the

        associated holiday type classifications.
      parameters:
        - name: countryCode
          in: path
          description: A valid `ISO 3166-1 alpha-2` country code.
          required: true
          schema:
            type: string
            default: us
        - name: year
          in: path
          description: The target year for which holidays should be retrieved.
          required: true
          schema:
            type: integer
            format: int32
            default: 2026
      responses:
        "200":
          description: Successfully retrieved the list of holidays.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HolidayV1Dto"
        "204":
          description: No holidays available.
          content:
            application/json: {}
        "400":
          description: The request was invalid. See the validation details for more
            information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "404":
          description: The provided country code is invalid or not recognized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
      x-scalar-stability: experimental
  /api/pro/v1/Holidays/{countryCode}/Next:
    get:
      tags:
        - Holidays
      summary: Retrieve all upcoming holidays occurring within the next 365 days for a
        given country
      description: The list includes only future holidays relative to the current date
        and is useful for forecasting, event planning, and applications that
        provide forward-looking holiday insights.
      parameters:
        - name: countryCode
          in: path
          description: A valid `ISO 3166-1 alpha-2` country code.
          required: true
          schema:
            type: string
            default: us
      responses:
        "200":
          description: A list of upcoming holidays for the next 365 days.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HolidayV1Dto"
        "204":
          description: No upcoming holidays were found for the specified country.
          content:
            application/json: {}
        "404":
          description: The provided country code is invalid or not recognized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
      x-scalar-stability: experimental
  /api/pro/v1/IotHolidays/{isoCode}/IsToday/{offset}:
    get:
      tags:
        - IotHolidays
      summary: Determines whether today is a public holiday in the specified country
        or subdivision, optionally adjusted by a UTC offset.
      description: >-
        By default, the calculation is based on the current UTC date.

        You may optionally provide a timezone offset to evaluate the holiday
        status relative to a different local timezone.


        This endpoint is optimized for simple command-line or automation
        workflows where only the HTTP status code is required


        ```

        STATUSCODE=$(curl --silent --output /dev/stderr --write-out
        "%{http_code}" https://date.nager.at/Api/v4/IotHolidays/AT-1/IsToday/2)

        if [ $STATUSCODE -eq 200 ]; then
            # Today is a public holiday
        fi

        ```
      parameters:
        - name: isoCode
          in: path
          description: A valid ISO 3166-1 alpha-2 country code (e.g., "AT") or an ISO
            3166-2 subdivision code (e.g., "AT-1").
          required: true
          schema:
            minLength: 2
            type: string
            default: us
        - name: offset
          in: path
          description: "UTC timezone offset in hours (range: -12 to +12). Default is 0."
          required: true
          schema:
            maximum: 12
            minimum: -12
            type: integer
            format: int32
            default: 0
      responses:
        "200":
          description: Today is a public holiday
          content:
            application/json: {}
        "204":
          description: Today is not a public holiday
          content:
            application/json: {}
        "400":
          description: The request was invalid. See the validation details for more
            information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
      x-scalar-stability: experimental
  /api/pro/v1/LongWeekends/{isoCode}/{year}:
    get:
      tags:
        - LongWeekends
      summary: Retrieves all long weekends for a given country or subdivision and year.
      description: >-
        A long weekend is calculated based on public holidays that create an
        extended break of at least three consecutive days.

        Optional bridge days-weekdays between a holiday and a weekend-can be
        included to identify potential extended leave opportunities.
      parameters:
        - name: isoCode
          in: path
          description: A valid ISO 3166-1 alpha-2 country code (e.g., "AT") or an ISO
            3166-2 subdivision code (e.g., "AT-1").
          required: true
          schema:
            minLength: 2
            type: string
            default: us
        - name: year
          in: path
          description: The target year for which long-weekend data should be calculated.
          required: true
          schema:
            type: integer
            format: int32
            default: 2026
        - name: availableBridgeDays
          in: query
          description: The maximum number of bridge days to include when determining
            long-weekend opportunities.
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 1
      responses:
        "200":
          description: Successfully returns the calculated long-weekend results for the
            specified country and year.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LongWeekendV1Dto"
        "400":
          description: The request was invalid. See the validation details for more
            information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
  /api/pro/v1/Versions:
    get:
      tags:
        - Versions
      summary: Retrieves the current version information of the Nager libraries.
      description: >-
        Returns detailed version information about the Nager implementation on
        the server,

        including the exact NuGet package versions used by the API.
      responses:
        "200":
          description: Version information was retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionInfoDto"
        "500":
          description: An unexpected server error occurred.
          content:
            application/json: {}
      x-scalar-stability: experimental
components:
  schemas:
    CountryInfoDto:
      required:
        - commonName
        - nativeName
        - officialName
        - countryCode
        - region
      type: object
      properties:
        commonName:
          type: string
          description: The commonly used name of the country.
        nativeName:
          type: string
          description: The name of the country in its native language.
        officialName:
          type: string
          description: The official name of the country.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        region:
          type: string
          description: Geopolitical or continental region of the country.
      description: Detailed information about a country.
    CountryInfoWithBordersDto:
      required:
        - commonName
        - nativeName
        - officialName
        - countryCode
        - region
      type: object
      properties:
        commonName:
          type: string
          description: The commonly used name of the country.
        nativeName:
          type: string
          description: The name of the country in its native language.
        officialName:
          type: string
          description: The official name of the country.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        region:
          type: string
          description: Geopolitical or continental region of the country.
        borders:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/CountryInfoDto"
          description: Neighboring countries based on geographical borders.
      description: Detailed information about a country, including neighboring countries.
    CountryV1Dto:
      required:
        - countryCode
        - commonName
        - nativeName
        - officialName
        - region
        - subRegion
      type: object
      properties:
        countryCode:
          type: string
          description: The ISO 3166-1 alpha-2 country code (e.g., "US", "DE").
        commonName:
          type: string
          description: The commonly used English name of the country.
        nativeName:
          type: string
          description: The name of the country in its native language.
        officialName:
          type: string
          description: The official name of the country.
        region:
          type: string
          description: The geopolitical region of the country (e.g., "Europe", "Americas").
        subRegion:
          type: string
          description: The specific sub-region of the country (e.g., "Western Europe",
            "Northern America").
      description: Represents a country supported by the Nager.Date API.
    HolidayTypes:
      enum:
        - Public
        - Bank
        - School
        - Authorities
        - Optional
        - Observance
      type: string
      format: string
    HolidayV1Dto:
      required:
        - id
        - date
        - observedDate
        - localName
        - englishName
        - countryCode
        - holidayTypes
      type: object
      properties:
        id:
          type: string
          description: Unique Id for the Holiday
        date:
          type: string
          description: The date of the holiday.
          format: date
        observedDate:
          type: string
          description: The date on which the holiday is observed.
          format: date
        localName:
          type: string
          description: Local name of the holiday.
        englishName:
          type: string
          description: English name of the holiday.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        nationalHoliday:
          type: boolean
          description: Indicates if this holiday applies to the entire country.
        subdivisionCodes:
          type:
            - "null"
            - array
          items:
            type: string
          description: ISO-3166-2 codes of the subdivisions where this holiday applies
        holidayTypes:
          type: array
          items:
            $ref: "#/components/schemas/HolidayTypes"
          description: List of holiday types this holiday is classified under.
      description: Represents a holiday.
    LongWeekendV1Dto:
      type: object
      properties:
        startDate:
          type: string
          description: The start date of the long weekend.
          format: date
        endDate:
          type: string
          description: The end date of the long weekend.
          format: date
        dayCount:
          type: integer
          description: Total number of days in the long weekend.
          format: int32
        needBridgeDay:
          type: boolean
          description: Indicates whether a bridge day is required to achieve the long
            weekend.
        bridgeDays:
          type: array
          items:
            type: string
            format: date
          description: Optional bridge days that extend the weekend.
      description: Represents a long weekend, including optional bridge days.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          type:
            - "null"
            - integer
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          type:
            - "null"
            - integer
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    VersionInfoDto:
      required:
        - name
        - version
      type: object
      properties:
        name:
          type: string
          description: The name of the library.
        version:
          type: string
          description: The version of the library.
      description: Version information.
  securitySchemes:
    ApiKey:
      type: apiKey
      description: Please enter your API key for Pro
      name: x-api-key
      in: header
tags:
  - name: Countries
    description: Provides access to detailed country information and the list of all
      countries supported by the API. This includes general metadata such as
      country names, codes, regions, and related details.
  - name: Holidays
    description: Includes functionality for retrieving public-holiday data, checking
      whether a specific day is a public holiday, and listing upcoming holidays.
  - name: IotHolidays
    description: Endpoints optimized for IoT devices and automation scripts. Returns
      only HTTP status codes (e.g., 200 OK or 204 No Content) without a response
      body to eliminate parsing overhead and reduce bandwidth.
  - name: LongWeekends
    description: Covers operations for retrieving long-weekend information. These
      endpoints help identify extended weekends created by public holidays,
      including optional bridge days.
  - name: Versions
    description: Returns information about the current version of the Nager.Date API in use.
